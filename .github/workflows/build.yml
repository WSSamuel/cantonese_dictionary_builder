name: Build Cantonese dictionary

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test preprocessing
        run: python -m unittest discover -s tests -v

      - name: Build database
        run: python build.py

      - name: Inspect database
        run: python scripts/check_db.py dist/cantonese.db

      - name: Show manifest
        run: cat dist/cantonese.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="cantonese-$(date -u +%Y.%m.%d)"
          gh release create "$VERSION" \
            dist/cantonese.db.gz \
            dist/cantonese.json \
            --title "$VERSION" \
            --generate-notes
